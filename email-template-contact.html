<!-- Paste this HTML into your EmailJS Contact Reply Template (Content tab) -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background:#F5F2EC; padding:40px 20px; color:#14130F;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width:520px; margin:0 auto; background:#FBF9F4; border:1px solid rgba(20,19,15,.10); border-radius:8px; overflow:hidden;">
    <tr>
      <td style="padding:40px 40px 20px; text-align:center; border-bottom:1px solid rgba(20,19,15,.10);">
        <div style="font-size:14px; color:#C77B7A; margin-bottom:8px;">◆</div>
        <div style="font-family: Georgia, serif; font-size:22px; font-weight:500; letter-spacing:6px; color:#14130F;">LUMIERE</div>
      </td>
    </tr>
    <tr>
      <td style="padding:40px;">
        <h1 style="font-family: Georgia, serif; font-size:26px; font-weight:400; color:#14130F; margin:0 0 20px; letter-spacing:-0.5px;">Hi {{to_name}},</h1>
        <p style="font-size:15px; line-height:1.7; color:#2A2722; margin:0 0 16px;">
          Thank you for getting in touch with {{salon_name}}. We received your message and will reply within one business day.
        </p>
        <div style="font-size:14px; color:#2A2722; line-height:1.7; padding:16px 18px; background:#F5F2EC; border-radius:6px; border-left:2px solid #C77B7A; margin:24px 0;">{{message}}</div>
        <p style="font-size:14px; color:#8A8273; margin:0;">— The {{salon_name}} team</p>
      </td>
    </tr>
  </table>
</div>
